<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rally AI Test Case Generator</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg,#667eea,#764ba2);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: auto; }
    header { text-align: center; color: white; margin-bottom: 30px; }
    h1 { font-size: 2.4rem; }
    .content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 800px) { .content { grid-template-columns: 1fr; } }
    .card {
      background: white;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,.25);
    }
    h2 { border-bottom: 3px solid #667eea; margin-bottom: 15px; padding-bottom: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 2px solid #ddd;
      font-size: 1rem;
    }
    button {
      background: linear-gradient(135deg,#667eea,#764ba2);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      padding: 12px 25px;
      cursor: pointer;
    }
    button:hover { opacity: .9; }
    .button-group { display:flex; gap:10px; }
    .tabs { display:flex; gap:10px; margin-bottom:15px; }
    .tab-button {
      background:white; color:#667eea;
      border:none; border-bottom:3px solid transparent;
      padding:10px 18px; cursor:pointer;
    }
    .tab-button.active {
      background:#667eea; color:white;
      border-bottom-color:#667eea;
    }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    .status { display:none; padding:12px; border-radius:5px; margin-bottom:10px; }
    .status.success { background:#d4edda; color:#155724; display:block; }
    .status.error { background:#f8d7da; color:#721c24; display:block; }
    .status.info { background:#d1ecf1; color:#0c5460; display:block; }
    .output {
      background:#f5f5f5;
      border:1px solid #ddd;
      padding:12px;
      font-family: monospace;
      white-space: pre-wrap;
      max-height:350px;
      overflow:auto;
    }
    .story-item {
      padding:10px;
      border:1px solid #ddd;
      border-radius:5px;
      margin-bottom:5px;
      cursor:pointer;
    }
    .story-item:hover { background:#f0f0f0; }
  </style>
</head>

<body>
<div class="container">
  <header>
    <h1>🚀 Rally AI Test Case Generator</h1>
    <p>Acceptance criteria → Structured test cases</p>
  </header>

  <div class="content">

    <div class="card">
      <h2>⚙️ Configuration</h2>
      <div id="configStatus"></div>

      <div class="form-group">
        <label for="aiProvider">AI Provider</label>
        <select id="aiProvider">
          <option value="groq">GROQ</option>
          <option value="openai">OpenAI</option>
          <option value="gemini">Google Gemini</option>
          <option value="claude">Claude</option>
        </select>
      </div>

      <div class="form-group">
        <label id="aiKeyLabel">AI API Key</label>
        <input type="password" id="aiApiKey" placeholder="Enter API key"/>
      </div>

      <button onclick="validateConfiguration()">✓ Validate Configuration</button>
    </div>

    <div class="card">
      <h2>🧪 Generate Test Cases</h2>
      <div id="generationStatus"></div>

      <div class="form-group">
        <label>Story Name</label>
        <input id="storyName">
      </div>

      <div class="form-group">
        <label>Acceptance Criteria</label>
        <textarea id="acceptanceCriteria"></textarea>
      </div>

      <button onclick="generateTestCases()">Generate Test Cases</button>
    </div>
  </div>

  <div id="outputSection" style="display:none;" class="card">
    <h2>📄 Output</h2>
    <div id="rawOutput" class="output"></div>
  </div>
</div>

<script>
const API_BASE = "http://localhost:3000";
let currentConfig = {};

/* ---------------- API Key Label Logic ---------------- */
document.addEventListener("DOMContentLoaded", () => {
  const provider = document.getElementById("aiProvider");
  const label = document.getElementById("aiKeyLabel");
  const input = document.getElementById("aiApiKey");

  const config = {
    groq: ["GROQ API Key","https://console.groq.com/keys"],
    openai: ["OpenAI API Key","https://platform.openai.com/api-keys"],
    gemini: ["Google Gemini API Key","https://ai.google.dev"],
    claude: ["Claude API Key","https://console.anthropic.com"]
  };

  function update() {
    const [text, url] = config[provider.value];
    label.textContent = text;
    input.placeholder = `Get key from ${url}`;
    input.value = "";
  }

  provider.addEventListener("change", update);
  update();
});

/* ---------------- Helpers ---------------- */
function showStatus(id,msg,type) {
  const el=document.getElementById(id);
  el.className=`status ${type}`;
  el.textContent=msg;
  el.style.display="block";
}

/* ---------------- Config ---------------- */
async function validateConfiguration() {
  const provider=document.getElementById("aiProvider").value;
  const apiKey=document.getElementById("aiApiKey").value;

  const res=await fetch(`${API_BASE}/api/config/validate`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({provider,apiKey})
  });

  const data=await res.json();
  if(!res.ok) return showStatus("configStatus",data.error,"error");

  currentConfig={provider,apiKey};
  showStatus("configStatus","✅ Configured","success");
}

/* ---------------- Generate ---------------- */
async function generateTestCases() {
  const storyName=document.getElementById("storyName").value;
  const acceptanceCriteria=document.getElementById("acceptanceCriteria").value;

  const res=await fetch(`${API_BASE}/api/generate/testcases`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({...currentConfig,storyName,acceptanceCriteria})
  });

  const data=await res.json();
  if(!res.ok) return showStatus("generationStatus",data.error,"error");

  document.getElementById("outputSection").style.display="block";
  document.getElementById("rawOutput").textContent=data.rawOutput;
  showStatus("generationStatus","✅ Generated","success");
}
</script>
</body>
</html>
