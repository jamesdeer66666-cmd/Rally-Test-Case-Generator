<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rally AI Test Case Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --bg: #f4f6fb;
      --card: #ffffff;
      --muted: #6c757d;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      margin: 0;
      padding: 30px;
      color: #333;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.4rem;
      margin-bottom: 8px;
    }

    header p {
      opacity: 0.9;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 16px;
      border-bottom: 3px solid var(--primary);
      padding-bottom: 6px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 0.95rem;
    }

    textarea { min-height: 110px; }

    button {
      margin-top: 16px;
      padding: 12px;
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }

    button.secondary {
      background: #e9ecf5;
      color: #333;
    }

    button:disabled {
      opacity: 0.6;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .status.success { background: #d4edda; color: #155724; }
    .status.error   { background: #f8d7da; color: #721c24; }
    .status.info    { background: #d1ecf1; color: #0c5460; }

    .endpoint {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .endpoint:hover {
      background: #f2f5ff;
      border-color: var(--primary);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .tab-btn {
      flex: 1;
      background: #e9ecf5;
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    pre {
      background: #f5f6fa;
      padding: 14px;
      border-radius: 6px;
      max-height: 420px;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
<div class="container">

<header>
  <h1>🚀 Rally AI Test Case Generator</h1>
  <p>From Swagger → Test Cases → Postman, in seconds</p>
</header>

<!-- ================= AI CONFIG ================= -->
<div class="card">
  <h2>⚙️ AI Configuration</h2>

  <label>AI Provider</label>
  <select id="aiProvider">
    <option value="groq">GROQ</option>
    <option value="openai">OpenAI</option>
    <option value="gemini">Gemini</option>
  </select>

  <label>API Key</label>
  <input type="password" id="apiKey">

  <button onclick="validateConfig()">Validate Configuration</button>
  <div id="configStatus"></div>
</div>

<!-- ================= SWAGGER ================= -->
<div class="card">
  <h2>📡 Swagger / OpenAPI</h2>

  <label>Swagger URL</label>
  <input id="swaggerUrl" value="https://petstore.swagger.io/">

  <button class="secondary" onclick="loadSwagger()">Load Endpoints</button>

  <div id="swaggerStatus"></div>
  <div id="swaggerEndpoints"></div>
</div>

<!-- ================= GENERATE ================= -->
<div class="card">
  <h2>🧪 Generate</h2>

  <label>Story Name</label>
  <input id="storyName">

  <label>Acceptance Criteria</label>
  <textarea id="acceptanceCriteria"></textarea>

  <label>API Endpoint (optional)</label>
  <input id="apiEndpoint">

  <button onclick="generate()">Generate Test Cases + Postman</button>
  <div id="generationStatus"></div>

  <div class="tabs">
    <div class="tab-btn active" onclick="showTab('testcases')">Test Cases</div>
    <div class="tab-btn" onclick="showTab('postman')">Postman</div>
  </div>

  <div id="testcasesTab">
    <pre id="testCasesOutput"></pre>
  </div>

  <div id="postmanTab" style="display:none;">
    <pre id="postmanOutput"></pre>
    <button onclick="downloadPostman()">Download Postman Collection</button>
  </div>
</div>

</div>

<script>
const API_BASE = 'http://localhost:3000';
let latestPostman = null;

/* ---------- helpers ---------- */
function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.className = 'status ' + type;
  el.textContent = msg;
}

function showTab(tab) {
  document.getElementById('testcasesTab').style.display =
    tab === 'testcases' ? 'block' : 'none';
  document.getElementById('postmanTab').style.display =
    tab === 'postman' ? 'block' : 'none';

  document.querySelectorAll('.tab-btn').forEach(btn =>
    btn.classList.remove('active')
  );
  document.querySelectorAll('.tab-btn')[tab === 'testcases' ? 0 : 1]
    .classList.add('active');
}

/* ---------- CONFIG ---------- */
async function validateConfig() {
  const provider = aiProvider.value;
  const apiKey = document.getElementById('apiKey').value;

  if (!apiKey) {
    setStatus('configStatus', 'API key required', 'error');
    return;
  }

  const body = { aiProvider: provider };
  if (provider === 'groq') body.groqApiKey = apiKey;
  else if (provider === 'gemini') body.geminiApiKey = apiKey;
  else body.openaiApiKey = apiKey;

  setStatus('configStatus', 'Validating...', 'info');

  const res = await fetch(`${API_BASE}/api/config/validate`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  const data = await res.json();

  res.ok
    ? setStatus('configStatus', data.message, 'success')
    : setStatus('configStatus', data.error, 'error');
}

/* ---------- SWAGGER ---------- */
async function loadSwagger() {
  const url = swaggerUrl.value;
  setStatus('swaggerStatus', 'Loading Swagger...', 'info');

  const res = await fetch(`${API_BASE}/api/generate/swagger-endpoints`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ swaggerUrl: url })
  });

  const data = await res.json();

  if (!res.ok) {
    setStatus('swaggerStatus', data.error, 'error');
    return;
  }

  setStatus('swaggerStatus', `Loaded ${data.endpoints.length} endpoints`, 'success');
  swaggerEndpoints.innerHTML = '';

  data.endpoints.forEach(e => {
    const el = document.createElement('div');
    el.className = 'endpoint';
    el.textContent = `${e.methods.join('/')} ${e.path}`;
    el.onclick = () => {
      storyName.value = e.summary || `${e.methods[0]} ${e.path}`;
      acceptanceCriteria.value =
        `Endpoint: ${e.methods[0]} ${e.path}\nValidate success and error cases.`;
      apiEndpoint.value = e.path;
    };
    swaggerEndpoints.appendChild(el);
  });
}

/* ---------- GENERATE ---------- */
async function generate() {
  setStatus('generationStatus', 'Generating...', 'info');

  const res = await fetch(`${API_BASE}/api/generate/combined`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      storyName: storyName.value,
      acceptanceCriteria: acceptanceCriteria.value,
      endpoint: apiEndpoint.value,
      aiProvider: aiProvider.value,
      apiKey: apiKey.value
    })
  });

  const data = await res.json();

  if (!res.ok) {
    setStatus('generationStatus', data.error, 'error');
    return;
  }

  testCasesOutput.textContent = JSON.stringify(data.testCases, null, 2);
  postmanOutput.textContent = JSON.stringify(data.postman, null, 2);
  latestPostman = data.postman;

  setStatus('generationStatus', 'Generation complete', 'success');
}

/* ---------- DOWNLOAD ---------- */
function downloadPostman() {
  const blob = new Blob(
    [JSON.stringify(latestPostman, null, 2)],
    { type: 'application/json' }
  );
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'postman_collection.json';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
