<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rally AI Test Case Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --card: #ffffff;
    }

    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    .card h2 {
      border-bottom: 3px solid var(--primary);
      padding-bottom: 6px;
      margin-bottom: 16px;
    }

    label {
      font-weight: 600;
      margin-top: 12px;
      display: block;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    textarea {
      min-height: 110px;
    }

    button {
      margin-top: 16px;
      padding: 12px;
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button.secondary {
      background: #e9ecf5;
      color: #333;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .status.success { background: #d4edda; }
    .status.error { background: #f8d7da; }
    .status.info { background: #d1ecf1; }

    .endpoint {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-top: 8px;
      cursor: pointer;
    }

    .endpoint:hover {
      background: #f2f5ff;
      border-color: var(--primary);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .tab-btn {
      flex: 1;
      background: #e9ecf5;
      padding: 10px;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    pre {
      background: #f5f6fa;
      padding: 14px;
      border-radius: 6px;
      max-height: 420px;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
<div class="container">

<header>
  <h1>🚀 Rally AI Test Case Generator</h1>
  <p>From Rally → Swagger → Test Cases → Postman</p>
</header>

<!-- AI CONFIG -->
<div class="card">
  <h2>⚙️ AI Configuration</h2>

  <label>AI Provider</label>
  <select id="aiProvider">
    <option value="groq">GROQ</option>
    <option value="openai">OpenAI</option>
    <option value="gemini">Gemini</option>
  </select>

  <label>AI API Key</label>
  <input type="password" id="apiKey">

  <label>Rally API Key (optional)</label>
  <input type="password" id="rallyApiKey">

  <label>Rally Workspace URL (optional)</label>
  <input
    id="rallyWorkspaceUrl"
    placeholder="https://rally1.rallydev.com"
  >

  <button onclick="validateConfig()">Validate Configuration</button>
  <button class="secondary" onclick="clearSavedConfig()">Clear Saved Config</button>

  <div id="configStatus"></div>
</div>

<!-- RALLY -->
<div class="card">
  <h2>📋 Rally Stories</h2>
  <button class="secondary" onclick="loadRallyStories()">Load Rally Stories</button>
  <div id="rallyStatus"></div>
  <div id="rallyStories"></div>
</div>

<!-- SWAGGER -->
<div class="card">
  <h2>📡 Swagger / OpenAPI</h2>

  <input
    id="swaggerUrl"
    value="https://petstore.swagger.io/"
    placeholder="https://api.example.com/swagger.json"
  />

  <details style="margin-top: 8px;">
    <summary>🔐 Authentication (optional)</summary>

    <select id="swaggerAuthType" style="margin-top: 6px;">
      <option value="">None</option>
      <option value="basic">Basic Auth</option>
      <option value="bearer">Bearer Token</option>
    </select>

    <!-- Basic Auth -->
    <div id="basicAuthFields" style="display:none;">
      <input
        id="swaggerUsername"
        type="text"
        placeholder="Username"
        style="margin-top: 6px;"
      />
      <input
        id="swaggerPassword"
        type="password"
        placeholder="Password"
        style="margin-top: 6px;"
      />
    </div>

    <!-- Bearer Auth -->
    <div id="bearerAuthFields" style="display:none;">
      <input
        id="swaggerBearerToken"
        type="password"
        placeholder="Bearer token (no 'Bearer ' prefix)"
        style="margin-top: 6px;"
      />
    </div>
  </details>

  <button class="secondary" onclick="loadSwagger()">
    Load Endpoints
  </button>

  <div id="swaggerStatus"></div>
  <div id="swaggerEndpoints"></div>
</div>


<!-- GENERATE -->
<div class="card">
  <h2>🧪 Generate</h2>

  <label>Story Name</label>
  <input id="storyName">

  <label>Acceptance Criteria</label>
  <textarea id="acceptanceCriteria"></textarea>

  <label>API Endpoint</label>
  <input id="apiEndpoint">

  <button onclick="generate()">Generate Test Cases + Postman</button>

  <div id="generationStatus"></div>

  <div class="tabs">
    <div class="tab-btn active" onclick="showTab('tc')">Test Cases</div>
    <div class="tab-btn" onclick="showTab('pm')">Postman</div>
  </div>

  <div id="tcTab">
    <pre id="testCasesOutput"></pre>
  </div>

  <div id="pmTab" style="display:none;">
    <pre id="postmanOutput"></pre>
    <button onclick="downloadPostman()">Download Postman Collection</button>
  </div>
</div>

</div>

<script>
const API_BASE = 'http://localhost:3000';
let latestPostman = null;
const CONFIG_KEY = 'rallyAiConfig';

/* ---------- Persistence ---------- */
function loadConfigFromStorage() {
  const saved = localStorage.getItem(CONFIG_KEY);
  if (!saved) return;

  try {
    const cfg = JSON.parse(saved);
    aiProvider.value = cfg.aiProvider || 'groq';
    apiKey.value = cfg.apiKey || '';
    rallyApiKey.value = cfg.rallyApiKey || '';
    rallyWorkspaceUrl.value = cfg.rallyWorkspaceUrl || '';

    setStatus('configStatus', '✅ Loaded saved configuration', 'success');
  } catch {}
}

function saveConfigToStorage(cfg) {
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
}

function clearSavedConfig() {
  localStorage.removeItem(CONFIG_KEY);
  apiKey.value = '';
  rallyApiKey.value = '';
  rallyWorkspaceUrl.value = '';
  setStatus('configStatus', 'Saved configuration cleared', 'info');
}

/* ---------- UI Helpers ---------- */
function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.className = 'status ' + type;
  el.textContent = msg;
}

function showTab(tab) {
  tcTab.style.display = tab === 'tc' ? 'block' : 'none';
  pmTab.style.display = tab === 'pm' ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-btn')[tab === 'tc' ? 0 : 1].classList.add('active');
}

/* ---------- CONFIG ---------- */
async function validateConfig() {
  const provider = aiProvider.value;
  const key = apiKey.value;
  const rallyKey = rallyApiKey.value;
  const rallyUrl = rallyWorkspaceUrl.value;

  if (!key) {
    setStatus('configStatus', 'AI API key is required', 'error');
    return;
  }

  const body = { aiProvider: provider };
  if (provider === 'groq') body.groqApiKey = key;
  else if (provider === 'gemini') body.geminiApiKey = key;
  else body.openaiApiKey = key;

  if (rallyKey && rallyUrl) {
    body.rallyApiKey = rallyKey;
    body.rallyWorkspaceUrl = rallyUrl;
  }

  setStatus('configStatus', 'Validating...', 'info');

  const res = await fetch(`${API_BASE}/api/config/validate`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  const data = await res.json();

  if (!res.ok) {
    setStatus('configStatus', data.error, 'error');
    return;
  }

  saveConfigToStorage({
    aiProvider: provider,
    apiKey: key,
    rallyApiKey: rallyKey,
    rallyWorkspaceUrl: rallyUrl
  });

  setStatus('configStatus', 'Configuration validated and saved ✅', 'success');
}

/* ---------- RALLY ---------- */
async function loadRallyStories() {
  setStatus('rallyStatus', 'Loading Rally stories...', 'info');
  const res = await fetch(`${API_BASE}/api/rally/stories`);
  const data = await res.json();

  if (!res.ok) {
    setStatus('rallyStatus', data.error, 'error');
    return;
  }

  rallyStories.innerHTML = '';
  data.stories.forEach(story => {
    const el = document.createElement('div');
    el.className = 'endpoint';
    el.textContent = `${story.id} — ${story.name}`;
    el.onclick = () => {
      loadRallyStory(story.id);
    };
    rallyStories.appendChild(el);
  });

  setStatus('rallyStatus', 'Stories loaded', 'success');
}

async function loadRallyStory(id) {
  const res = await fetch(`${API_BASE}/api/rally/story/${id}`);
  const data = await res.json();
  storyName.value = data.name;
  acceptanceCriteria.value = data.acceptanceCriteria;
}

/* ---------- SWAGGER ---------- */
async function loadSwagger() {
  setStatus('swaggerStatus', 'Loading Swagger...', 'info');

  const payload = {
    swaggerUrl: swaggerUrl.value.trim()
  };

  const authType = swaggerAuthType.value;

  if (authType === 'basic') {
    if (swaggerUsername.value || swaggerPassword.value) {
      payload.auth = {
        type: 'basic',
        username: swaggerUsername.value,
        password: swaggerPassword.value
      };
    }
  }

  if (authType === 'bearer') {
    if (swaggerBearerToken.value) {
      payload.auth = {
        type: 'bearer',
        token: swaggerBearerToken.value.trim()
      };
    }
  }

  try {
    const res = await fetch(`${API_BASE}/api/generate/swagger-endpoints`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      setStatus('swaggerStatus', 'Failed to load Swagger', 'error');
      return;
    }

    const data = await res.json();

    swaggerEndpoints.innerHTML = '';

    if (!Array.isArray(data.endpoints) || data.endpoints.length === 0) {
      setStatus('swaggerStatus', 'No endpoints found', 'warning');
      return;
    }

    data.endpoints.forEach(e => {
      const el = document.createElement('div');
      el.className = 'endpoint';
      el.textContent = `${e.methods.join('/')} ${e.path}`;

      el.onclick = () => {
        storyName.value = e.summary || e.path;
        acceptanceCriteria.value = `Endpoint: ${e.path}`;
        apiEndpoint.value = e.path;
      };

      swaggerEndpoints.appendChild(el);
    });

    setStatus('swaggerStatus', 'Endpoints loaded', 'success');
  } catch (err) {
    console.error(err);
    setStatus('swaggerStatus', 'Error loading Swagger', 'error');
  }
}

/* ---------- GENERATE ---------- */
async function generate() {
  setStatus('generationStatus', 'Generating...', 'info');

  const res = await fetch(`${API_BASE}/api/generate/combined`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      storyName: storyName.value,
      acceptanceCriteria: acceptanceCriteria.value,
      endpoint: apiEndpoint.value,
      aiProvider: aiProvider.value,
      apiKey: apiKey.value
    })
  });

  const data = await res.json();

  if (!res.ok) {
    setStatus('generationStatus', data.error, 'error');
    return;
  }

  testCasesOutput.textContent = JSON.stringify(data.testCases, null, 2);
  postmanOutput.textContent = JSON.stringify(data.postman, null, 2);
  latestPostman = data.postman;

  setStatus('generationStatus', 'Generation complete', 'success');
}

/* ---------- DOWNLOAD ---------- */
function downloadPostman() {
  const blob = new Blob(
    [JSON.stringify(latestPostman, null, 2)],
    { type: 'application/json' }
  );

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'postman_collection.json';
  a.click();
}


/* ---------- SWAGGER AUTH TOGGLE ---------- */
document.addEventListener('DOMContentLoaded', () => {
  const authType = document.getElementById('swaggerAuthType');
  const basicFields = document.getElementById('basicAuthFields');
  const bearerFields = document.getElementById('bearerAuthFields');

  if (!authType || !basicFields || !bearerFields) {
    console.error('Swagger auth elements not found');
    return;
  }

  function updateSwaggerAuthFields() {
    basicFields.style.display =
      authType.value === 'basic' ? 'block' : 'none';

    bearerFields.style.display =
      authType.value === 'bearer' ? 'block' : 'none';
  }

  authType.addEventListener('change', updateSwaggerAuthFields);

  // Ensure correct state on page load
  updateSwaggerAuthFields();
});


/* ---------- INIT ---------- */
loadConfigFromStorage();
</script>

</body>
</html>
