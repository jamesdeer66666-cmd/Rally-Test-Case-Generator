<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rally AI Test Case Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    textarea {
      min-height: 100px;
    }

    button {
      margin-top: 16px;
      padding: 12px;
      width: 100%;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #5a67d8;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 4px;
    }

    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.info { background: #d1ecf1; color: #0c5460; }

    .endpoint {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: 6px;
      cursor: pointer;
    }

    .endpoint:hover {
      background: #eef;
    }

    pre {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 4px;
      max-height: 400px;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>🚀 Rally AI Test Case Generator</h1>

  <!-- ================= AI CONFIG ================= -->
  <div class="card">
    <h2>AI Configuration</h2>

    <label>AI Provider</label>
    <select id="aiProvider">
      <option value="groq">GROQ</option>
      <option value="openai">OpenAI</option>
      <option value="gemini">Gemini</option>
    </select>

    <label>API Key</label>
    <input type="password" id="apiKey">

    <button onclick="validateConfig()">Validate Configuration</button>
    <div id="configStatus"></div>
  </div>

  <!-- ================= SWAGGER ================= -->
  <div class="card">
    <h2>Swagger / OpenAPI</h2>

    <label>Swagger URL (optional)</label>
    <input id="swaggerUrl" value="https://petstore.swagger.io/">

    <button onclick="loadSwagger()">Load Swagger</button>
    <div id="swaggerStatus"></div>
    <div id="swaggerEndpoints"></div>
  </div>

  <!-- ================= GENERATE ================= -->
  <div class="card">
    <h2>Generate</h2>

    <label>Story Name</label>
    <input id="storyName">

    <label>Acceptance Criteria</label>
    <textarea id="acceptanceCriteria"></textarea>

    <label>API Endpoint (optional)</label>
    <input id="apiEndpoint">

    <button onclick="generate()">Generate Test Cases + Postman</button>
    <div id="generationStatus"></div>

    <h3>Output</h3>
    <pre id="output"></pre>
  </div>

</div>

<script>
const API_BASE = 'http://localhost:3000';

/* ---------- helpers ---------- */
function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.className = 'status ' + type;
  el.textContent = msg;
}

/* ---------- config ---------- */
async function validateConfig() {
  const provider = document.getElementById('aiProvider').value;
  const apiKey = document.getElementById('apiKey').value;

  if (!apiKey) {
    setStatus('configStatus', 'API key required', 'error');
    return;
  }

  const body = { aiProvider: provider };
  if (provider === 'groq') body.groqApiKey = apiKey;
  else if (provider === 'gemini') body.geminiApiKey = apiKey;
  else body.openaiApiKey = apiKey;

  setStatus('configStatus', 'Validating...', 'info');

  const res = await fetch(`${API_BASE}/api/config/validate`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  const data = await res.json();

  if (!res.ok) {
    setStatus('configStatus', data.error, 'error');
    return;
  }

  setStatus('configStatus', data.message, 'success');
}

/* ---------- swagger ---------- */
async function loadSwagger() {
  const url = document.getElementById('swaggerUrl').value;

  setStatus('swaggerStatus', 'Loading Swagger...', 'info');

  const res = await fetch(`${API_BASE}/api/generate/swagger-endpoints`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ swaggerUrl: url })
  });

  const data = await res.json();

  if (!res.ok) {
    setStatus('swaggerStatus', data.error, 'error');
    return;
  }

  setStatus(
    'swaggerStatus',
    `Loaded ${data.endpoints.length} endpoints`,
    'success'
  );

  const container = document.getElementById('swaggerEndpoints');
  container.innerHTML = '';

  data.endpoints.forEach(e => {
    const div = document.createElement('div');
    div.className = 'endpoint';
    div.textContent = `${e.methods.join('/')} ${e.path}`;
    div.onclick = () => {
      document.getElementById('storyName').value =
        e.summary || `${e.methods[0]} ${e.path}`;

      document.getElementById('acceptanceCriteria').value =
        `Endpoint: ${e.methods[0]} ${e.path}\nValidate success and error cases.`;

      document.getElementById('apiEndpoint').value = e.path;
    };
    container.appendChild(div);
  });
}

/* ---------- generate ---------- */
async function generate() {
  const storyName = document.getElementById('storyName').value;
  const acceptanceCriteria = document.getElementById('acceptanceCriteria').value;
  const endpoint = document.getElementById('apiEndpoint').value;

  const provider = document.getElementById('aiProvider').value;
  const apiKey = document.getElementById('apiKey').value;

  if (!storyName || !acceptanceCriteria) {
    setStatus('generationStatus', 'Missing required fields', 'error');
    return;
  }

  setStatus('generationStatus', 'Generating...', 'info');

  const res = await fetch(`${API_BASE}/api/generate/combined`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      storyName,
      acceptanceCriteria,
      endpoint,
      aiProvider: provider,
      apiKey
    })
  });

  const data = await res.json();

  if (!res.ok) {
    setStatus('generationStatus', data.error, 'error');
    return;
  }

  setStatus('generationStatus', 'Generation complete', 'success');
  document.getElementById('output').textContent =
    JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
